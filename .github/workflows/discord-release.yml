
name: Discord Release Notification

on:
  release:
    types: [published]

jobs:
  notify-discord:
    runs-on: ubuntu-latest

    steps:
      - name: Send release notes to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RELEASE_EVENT: ${{ toJSON(github.event.release) }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request
          import urllib.parse

          release = json.loads(os.environ["RELEASE_EVENT"])

          version = release.get("tag_name") or "New Release"
          notes = release.get("body") or "No release notes provided."
          url = release["html_url"]
          repo = os.environ["REPOSITORY"]

          # Public logo from GitHub
          LOGO_URL = (
              f"https://raw.githubusercontent.com/"
              f"{repo}/main/public/img/logo.png"
          )

          # Discord embed description limit: 4096
          max_notes = 3800
          if len(notes) > max_notes:
              notes = notes[:max_notes].rstrip() + "\n\n*...truncated*"

          # Brand color: #5e865b
          brand_color = int("5e865b", 16)

          prerelease = release.get("prerelease", False)
          status = "🧪 Pre-release" if prerelease else "🚀 New Release"

          embed = {
              "author": {
                  "name": "Jastuk Tracker • Release Updates",
                  "url": f"https://github.com/{repo}",
                  "icon_url": LOGO_URL
              },
              "title": f"{status}  •  {version}",
              "url": url,
              "description": (
                  "A new version of **Jastuk Tracker** is available!\n\n"
                  "### 📋 What's New\n"
                  f"{notes}"
              ),
              "color": brand_color,
              "thumbnail": {
                  "url": LOGO_URL
              },
              "footer": {
                  "text": "Jastuk Tracker • GitHub Releases",
                  "icon_url": LOGO_URL
              },
              "timestamp": release.get("published_at")
          }

          payload = {
              "username": "Jastuk Tracker Updates",
              "avatar_url": LOGO_URL,
              "embeds": [embed],
              "components": [{
                  "type": 1,
                  "components": [{
                      "type": 2,
                      "style": 5,
                      "label": "View Release & Download",
                      "emoji": {"name": "📦"},
                      "url": url
                  }]
              }],
              "allowed_mentions": {"parse": []}
          }

          # Enable Discord webhook buttons
          webhook_url = os.environ["DISCORD_WEBHOOK_URL"]
          separator = "&" if "?" in webhook_url else "?"
          webhook_url += f"{separator}with_components=true"

          request = urllib.request.Request(
              webhook_url,
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Content-Type": "application/json",
                  "User-Agent": "Jastuk-Tracker-Release"
              },
              method="POST"
          )

          with urllib.request.urlopen(request) as response:
              print(f"Discord notification sent: {response.status}")
          PY
