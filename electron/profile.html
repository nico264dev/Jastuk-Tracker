<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Profile - Jastuk Tracker</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-page="profile">
  <div class="app-shell">
    <div data-partial="sidebar"></div>

    <main class="content">
      <header class="topbar">
        <div>
          <div class="page-title">My Profile</div>
        </div>
      </header>

      <section class="panel active">
        <article class="profile-shell">
          <div id="profile-banner" class="profile-banner"></div>
          <div class="profile-main">
            <div class="profile-avatar-wrap">
              <img id="profile-avatar" class="profile-avatar" src="../public/img/logo.png" alt="Driver avatar" />
            </div>
            <div class="profile-identity">
              <div class="profile-kicker">Driver Profile</div>
              <h2 id="profile-name">Loading profile...</h2>
              <div id="profile-roles" class="profile-roles"></div>
            </div>
            <div class="profile-ranks">
              <div class="profile-rank">
                <span>Driver Rank</span>
                <strong id="profile-driver-rank">-</strong>
              </div>
            </div>
          </div>
        </article>

        <div class="grid-4 profile-stats-grid">
          <article class="card stat-card">
            <div class="stat-icon"><i class="fa-solid fa-briefcase"></i></div>
            <h3>Personal jobs</h3>
            <div id="profile-total-jobs" class="stat-value">-</div>
          </article>
          <article class="card stat-card">
            <div class="stat-icon"><i class="fa-solid fa-route"></i></div>
            <h3>Personal kilometers</h3>
            <div id="profile-distance" class="stat-value">-</div>
          </article>
          <article class="card stat-card">
            <div class="stat-icon"><i class="fa-solid fa-calendar-check"></i></div>
            <h3>Events attended</h3>
            <div id="profile-events" class="stat-value">-</div>
          </article>
          <article class="card stat-card">
            <div class="stat-icon"><i class="fa-solid fa-money-bill-wave"></i></div>
            <h3>Personal earnings</h3>
            <div id="profile-earnings" class="stat-value">-</div>
          </article>
        </div>

        <div class="profile-grid">
          <article class="card profile-details-card">
            <h3><i class="fa-solid fa-address-card"></i> Details</h3>
            <div class="card-row"><span>Personal Jobs</span><span id="profile-details-jobs">-</span></div>
            <div class="card-row"><span>Name</span><span id="profile-steam-name">-</span></div>
            <div class="card-row"><span>Steam ID</span><span id="profile-steam-id">-</span></div>
            <div class="card-row"><span>Country</span><span id="profile-country">-</span></div>
            <div class="card-row"><span>Joined</span><span id="profile-joined">-</span></div>
          </article>

          <article class="card profile-details-card">
            <h3><i class="fa-solid fa-star"></i> Progress</h3>
            <div class="card-row"><span>Points</span><span id="profile-points">-</span></div>
            <div class="card-row"><span>Monthly Wins</span><span id="profile-weekly-wins">-</span></div>
            <div class="card-row"><span>Total Events Attended</span><span id="profile-total-events">-</span></div>
          </article>
        </div>

        <article class="card card-full profile-jobs-card">
          <h3><i class="fa-solid fa-table-list"></i> Jobs by month</h3>
          <div id="profile-monthly-jobs" class="monthly-jobs-list">
            <div class="help-text">Loading jobs...</div>
          </div>
        </article>
      </section>

      <div data-partial="footer"></div>
    </main>
  </div>

  <script src="partials/layout.js"></script>
  <script src="profile-renderer.js"></script>
</body>
</html>
